[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qmaml-hep"
version = "0.3.0"
description = "Learned initialization (Q-MAML) for variational quantum circuits on HEP Hamiltonians, benchmarked against classical and warm-start baselines"
readme = "README.md"
license = "MIT"
authors = [{ name = "Arnav Kapoor", email = "arnavkapoor23@iiserb.ac.in" }]
requires-python = ">=3.10"
keywords = ["variational quantum eigensolver", "meta-learning", "lattice gauge theory", "benchmark", "quantum machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "pennylane>=0.38",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "matplotlib>=3.8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Repository = "https://github.com/arnavk23/qmaml-hep"
Documentation = "https://arnavk23.github.io/qmaml-hep"
Changelog = "https://github.com/arnavk23/qmaml-hep/blob/main/CHANGELOG.md"

[project.scripts]
qmaml-benchmark = "qmaml_hep.benchmark:main"
qmaml-score = "qmaml_hep.analysis:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B023", "B905", "UP006", "UP035"]

[tool.ruff.lint.isort]
known-first-party = ["qmaml_hep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end runs (minutes); deselect with -m 'not slow'"]

[tool.coverage.run]
source = ["qmaml_hep"]
omit = ["*/experiments/*", "*/classification/higgs.py", "*/classification/quarkgluon.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
