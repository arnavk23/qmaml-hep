name: Slow tests

# End-to-end reproduction against the committed results, the full UCCSD simulator check and the rescoring
# regression test. Weekly, and on demand.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -m slow -v
